<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
  <title>Alexandre DHORNE — Design Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="../assets/css/style.css"rel="stylesheet" />

</head>
<body>
    <div class="scroll-hint">
      <div class="scroll-line"></div>
      <a href="../">
      Retour en arrière
      </a>
    </div>

    <section>
        <p class="section-label reveal">Générateur de QR Code</p>
        <div class="about-grid">
            <div class="slideshow-container">

                <div class="mySlides fade">
                    <div class="numbertext">1 / 3</div>
                    <img src="../assets/img/qrcode1.png" style="width:100%">
                </div>

                <div class="mySlides fade">
                    <div class="numbertext">2 / 3</div>
                    <img src="../assets/img/qrcode2.png" style="width:100%">
                </div>

                <div class="mySlides fade">
                    <div class="numbertext">3 / 3</div>
                    <img src="../assets/img/qrcode3.png" style="width:100%">
                </div>

                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            
            <div class="about-body reveal">
                <p>
                Ce script Python a été crée pour simplifier l'accès a mon portfolio sur mon CV.
                </p>
                <div class="skills">
                    <span class="skill-tag">Python</span>
                </div>
            </div>
        </div>
    </section>

    <script src="../assets/js/script.js"></script>
</body>
</html>
